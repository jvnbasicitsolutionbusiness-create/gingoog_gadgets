<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Inventory - Create Account</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS CDN para sa pag-send sa OTP sa Gmail -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <img src="/logo pic/ChatGPT Image Sep 10, 2026, 11_04_23 PM.png" alt="Gingoog Gadgets logo">
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Inventory Management System</p>

            <!-- Step 1: Form para sa Email ug Password -->
            <form id="registerForm">

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>

                    <div class="password-box">
                        <input type="password" id="reg-password" placeholder="Create password" required>

                        <button type="button" id="showRegPassword" class="show-btn">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Send OTP to Email
                </button>

            </form>

            <!-- Step 2: Form para sa OTP Verification (Mogawas pagkahuman ma-click ang Send OTP) -->
            <form id="otpForm" style="display: none;">

                <div class="input-group">
                    <label for="otpInput">OTP Code (Gmail)</label>
                    <input type="text" id="otpInput" placeholder="Enter 6-digit code" maxlength="6" required style="text-align: center; letter-spacing: 3px; font-weight: bold;">
                </div>

                <button type="submit" class="login-btn">
                    Verify & Create Account
                </button>

            </form>

            <p id="regMessage"></p>

            <div class="options" style="margin-top: 20px; margin-bottom: 0; justify-content: center;">
                <span class="remember">Already have an account?</span>
                <a href="index.html" style="margin-left: 5px; font-weight: bold;">Login here</a>
            </div>

            <div class="footer">
                <p>© 2026 Store Inventory System</p>
            </div>

        </div>

    </div>

    <script src="register.js"></script>

</body>

</html>
