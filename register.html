<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Inventory - Create Account</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- EmailJS SDK (Kinahanglanon para mag-send ug OTP sa Gmail) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <img src="/logo pic/ChatGPT Image Sep 10, 2026, 11_04_23 PM.png" alt="Gingoog Gadgets logo">
            </div>

            <h1 id="pageTitle">Create Account</h1>
            <p class="subtitle" id="pageSubtitle">Inventory Management System</p>

            <!-- STEP 1: Registration Form -->
            <form id="registerForm">

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="reg-email">Gmail Address</label>
                    <input type="email" id="reg-email" placeholder="Enter your gmail" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <div class="password-box">
                        <input type="password" id="reg-password" placeholder="Enter password" required>
                        <button type="button" id="showRegPassword" class="show-btn">Show</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirm-password" placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Register
                </button>

            </form>

            <!-- STEP 2: OTP Form (Hidden by default) -->
            <form id="otpForm" style="display: none;">

                <div class="input-group">
                    <label for="otpInput">Enter OTP Code (Gmail)</label>
                    <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" class="otp-input" required>
                </div>

                <button type="submit" class="login-btn">
                    Verify OTP & Complete Registration
                </button>

            </form>

            <p id="message"></p>

            <div class="options" style="justify-content: center; margin-top: 15px;">
                <span class="remember">Already have an account?</span>
                <a href="index.html" style="margin-left: 5px; font-weight: bold;">Login here</a>
            </div>

            <div class="footer">
                <p>© 2026 Store Inventory System</p>
            </div>

        </div>

    </div>

    <script src="register.js"></script>

</body>

</html>
